<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>post2md</title>
  <meta name="description" content="Turn an X post or thread into markdown plus images for an LLM.">
  <meta name="theme-color" content="#1d2430">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f5f1; --fg: #1d2430; --muted: #5e6672; --line: #d9d6cc;
      --panel: #ffffff; --accent: #2b5fd9; --accent-fg: #ffffff; --err: #b3261e; --ok: #1e7a3c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181f; --fg: #e8e6e1; --muted: #9aa1ab; --line: #2c333d;
        --panel: #1c2129; --accent: #7aa2ff; --accent-fg: #0d1117; --err: #ff8a80; --ok: #7bd88f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
    form { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    }
    button, .button {
      padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none;
      display: inline-block;
    }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { min-height: 1.5em; margin: 12px 0; color: var(--muted); }
    #status.error { color: var(--err); }
    #status.ok { color: var(--ok); }
    .actions { display: flex; gap: 8px; margin: 12px 0; }
    .actions .primary { flex: 1; }
    textarea {
      width: 100%; min-height: 40vh; padding: 12px; resize: vertical;
      font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    }
    h2 { font-size: 0.95rem; margin: 20px 0 8px; color: var(--muted); font-weight: 600; }
    #images { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .thumb {
      position: relative; display: block; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; background: var(--panel); cursor: pointer;
    }
    .thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .thumb input { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; }
    .thumb span { display: block; padding: 4px 8px; font-size: 0.8rem; color: var(--muted); }
    .thumb.failed span { color: var(--err); }
    #handoff p { margin: 0 0 8px; }
    .option { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; }
    .option input { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>post2md</h1>
    <p class="sub">Share an X post here, then share the result into Claude or ChatGPT.</p>

    <form id="form">
      <input id="input" type="text" inputmode="url" autocomplete="off" placeholder="Paste an X or Reddit link" aria-label="Post link">
      <button type="submit">Go</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <section id="handoff" hidden>
      <p id="handoffNote"></p>
      <a id="handoffLink" class="button" href="#" target="_blank" rel="noopener"></a>
    </section>

    <section id="result" hidden>
      <div class="actions">
        <button id="share" class="primary" type="button">Share</button>
        <button id="copy" type="button">Copy</button>
      </div>
      <div id="imagesBlock">
        <h2>Images to attach (ticked ones go with Share, up to 4)</h2>
        <div id="images"></div>
      </div>
      <label class="option"><input id="includeReplies" type="checkbox" checked> Include replies</label>
      <h2>Markdown</h2>
      <textarea id="markdown" readonly spellcheck="false" aria-label="Markdown output"></textarea>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
